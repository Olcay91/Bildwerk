<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bildlauf-Aufnahme</title>
<style>
  html,body{margin:0;height:100%;background:#1B1A17;overflow:hidden}
  @font-face{font-family:"Office Code Pro";font-weight:100 900;src:local("Office Code Pro"),local("OfficeCodePro-Regular"),
    url("fonts/OfficeCodePro-Regular.woff2") format("woff2"),url("fonts/OfficeCodePro-Regular.woff") format("woff"),url("fonts/OfficeCodePro-Regular.otf") format("opentype")}
  :root{font-synthesis:none}
  *{font-weight:400!important}
  body{font:13px/1.35 "Office Code Pro","Source Code Pro",ui-monospace,Consolas,Menlo,monospace;
    color:#fff;-webkit-user-select:none;user-select:none}
  .bar{box-sizing:border-box;height:100%;background:#1B1A17;border:1px solid #3A3832;padding:10px 12px;
    display:flex;flex-direction:column;justify-content:center;gap:8px}
  .top{display:flex;align-items:center;gap:10px}
  .rec{width:10px;height:10px;border-radius:50%;background:#E5484D;flex:none;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion: reduce){.rec{animation:none}}
  .title{font-weight:650}
  body.waiting .rec{background:#FFC93C}
  body.waiting .hint{color:#FFC93C}
  .h{margin-left:auto;font-variant-numeric:tabular-nums;color:#FFC93C;font-weight:650}
  .hint{color:#AAB3BF;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;gap:6px}
  button{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;color:#E5E8ED;background:#2E2C27}
  button:hover{filter:brightness(1.15)}
  button:focus-visible{outline:2px solid #FFC93C;outline-offset:2px}
  #auto[aria-pressed="true"]{background:#FFE45C;color:#1F1B05}
  #done{background:#FFE45C;color:#1F1B05;margin-left:auto}
</style>
</head>
<body>
  <div class="bar">
    <div class="top">
      <span class="rec" aria-hidden="true"></span>
      <span class="title">Bildlauf-Aufnahme</span>
      <span class="h" id="height">0 px</span>
    </div>
    <div class="row">
      <button id="auto" aria-pressed="false">Automatisch scrollen</button>
      <button id="cancel">Abbrechen</button>
      <button id="done">Fertig</button>
    </div>
    <div class="hint" id="hint">Scrolle jetzt im gewählten Bereich langsam nach unten.</div>
  </div>
  <script src="i18n.js"></script>
  <script src="scroll.js"></script>
</body>
</html>
